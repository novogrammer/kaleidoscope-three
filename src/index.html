<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="カメラに映った顔を万華鏡のように変化させる、HDR対応のインタラクティブ作品です。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="顔万華鏡" />
    <meta
      property="og:description"
      content="カメラに映った顔を万華鏡のように変化させる、HDR対応のインタラクティブ作品です。"
    />
    <meta
      property="og:url"
      content="https://novogrammer.github.io/kaleidoscope-three/"
    />
    <meta
      property="og:image"
      content="https://novogrammer.github.io/kaleidoscope-three/ogp.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="顔を反復した万華鏡と色鮮やかな紙吹雪"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>顔万華鏡</title>
  </head>
  <body>
    <main id="app" class="app">
      <canvas
        id="stage"
        class="stage"
        aria-label="顔万華鏡の描画画面"
      ></canvas>

      <section id="start-screen" class="start-screen" aria-labelledby="title">
        <div class="start-panel">
          <p class="eyebrow">FACE KALEIDOSCOPE</p>
          <h1 id="title">顔万華鏡</h1>
          <p class="warning">
            強い光や点滅を含みます。明るい部屋で、画面から離れてご覧ください。
            <span class="warning-translation" lang="en">
              Contains bright lights and flashing imagery. View in a well-lit
              room and keep a safe distance from the screen.
            </span>
          </p>
          <button id="start-button" class="start-button" type="button">
            はじめる / Start
          </button>
          <p id="start-status" class="start-status" aria-live="polite">
            ボタンを押すと描画を開始します
          </p>
          <p class="repository-link">
            <a
              href="https://github.com/novogrammer/kaleidoscope-three"
              target="_blank"
              rel="noopener noreferrer"
            >GitHubでソースコードを見る</a>
          </p>
        </div>
      </section>

      <div id="runtime-status" class="runtime-status" hidden>
        <span id="backend-status">描画を準備中</span>
        <span id="output-status">出力を確認中</span>
        <span id="input-status">入力設定を確認中</span>
      </div>
    </main>

    <noscript>この作品を表示するにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
